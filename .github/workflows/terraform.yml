name: Terraform Plan & Apply

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/**'

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.6.0

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan (Dev)
        working-directory: terraform
        run: terraform plan -var-file="environments/dev.tfvars" -out=tfplan-dev
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'

      - name: Terraform Plan (Staging)
        working-directory: terraform
        run: terraform plan -var-file="environments/staging.tfvars" -out=tfplan-staging
        if: github.event_name == 'pull_request' && github.base_ref == 'main'

      - name: Terraform Plan (Prod)
        working-directory: terraform
        run: terraform plan -var-file="environments/prod.tfvars" -out=tfplan-prod
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const planOutput = 'Plan output will be commented here';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `\`\`\`\n${planOutput}\n\`\`\``
            });

      - name: Terraform Apply (Dev)
        working-directory: terraform
        run: terraform apply -auto-approve -var-file="environments/dev.tfvars"
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

      - name: Terraform Apply (Staging)
        working-directory: terraform
        run: terraform apply -auto-approve -var-file="environments/staging.tfvars"
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Upload Terraform State
        working-directory: terraform
        run: echo "Terraform state updated"
        if: github.event_name == 'push'
